{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if page.has_previous %}<a href="?{{ querystring }}{% if querystring %}&amp;{% endif %}page={{ page.previous_page_number }}" rel="prev">‹ Previous</a>{% else %}<span class="disabled">‹ Previous</span>{% endif %}
  <span class="page-status">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?{{ querystring }}{% if querystring %}&amp;{% endif %}page={{ page.next_page_number }}" rel="next">Next ›</a>{% else %}<span class="disabled">Next ›</span>{% endif %}
</nav>
{% endif %}

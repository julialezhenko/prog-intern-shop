{% extends "base.html" %}
{% block title %}Change password — {{ STORE_NAME }}{% endblock %}
{% block content %}
<div class="auth-card card">
  <h1>Change password</h1>
  <form method="post">{% csrf_token %}
    {% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for e in field.errors %}<small class="error-text">{{ e }}</small>{% endfor %}</div>{% endfor %}
    <button type="submit" class="button block">Save new password</button>
  </form>
</div>
{% endblock %}
